name: main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  build:
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master'}}
    strategy:
      fail-fast: false
      matrix:
        include: [
          { msystem: UCRT64, runner: windows-2025 },
          { msystem: CLANG64, runner: windows-2025 },
          { msystem: MINGW64, runner: windows-2025 },
          { msystem: MINGW32, runner: windows-2025 },
          { msystem: CLANGARM64, runner: windows-11-arm }
        ]
    name: ${{ matrix.msystem }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Get CPU Name
        run : |
          Get-CIMInstance -Class Win32_Processor | Select-Object -Property Name

      - name: Setup JIT minidump
        if: ${{ matrix.msystem != 'CLANGARM64' }}
        run: |
          Set-Location '${{ runner.temp }}'
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Procdump.zip' -OutFile Procdump.zip
          Expand-Archive Procdump.zip -DestinationPath .
          New-Item -Path '_dumps' -ItemType Directory
          .\procdump64.exe -accepteula -ma -i "${{ runner.temp }}/_dumps"
          .\procdump.exe -accepteula -ma -i "${{ runner.temp }}/_dumps"

      - name: Configure Pagefile
        if: ${{ matrix.msystem != 'CLANGARM64' }}
        # https://github.com/al-cheb/configure-pagefile-action/issues/16
        continue-on-error: true
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 4GB
          maximum-size: 16GB
          disk-root: "C:"

      - uses: actions/checkout@v4
        with:
          path: temp
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # to match the autobuild environment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: git python base-devel
          update: true
          release: ${{ runner.arch != 'ARM64' }}
          location: 'D:\M'

      - name: Add staging repo
        shell: msys2 {0}
        run: |
          cp /etc/pacman.conf /etc/pacman.conf.bak
          grep -qFx '[staging]' /etc/pacman.conf || sed -i '/^# \[staging\]/,/^$/ s|^# ||g' /etc/pacman.conf

      - name: Update using staging
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          msys2 -c 'pacman --noconfirm -Suu'

      - name: Move Checkout
        run: |
          If (Test-Path "C:\_") { rm -r -fo "C:\_" }
          Copy-Item -Path ".\temp" -Destination "C:\_" -Recurse

      - name: CI-Build
        shell: msys2 {0}
        id: build
        run: |
          cd /C/_
          unset VCPKG_ROOT
          SOURCE_DATE_EPOCH=1786654184 \
          CI_BASE_REPOSITORY=crutkas/MINGW-packages \
          CI_BASE_BRANCH=woarm64 \
          MINGW_ARCH=${{ matrix.msystem }} ./.ci/ci-build.sh

      - name: Test and reproduce native ARM64 package
        if: ${{ matrix.msystem == 'CLANGARM64' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd /C/_/mingw-w64-busybox
          export SOURCE_DATE_EPOCH=1786654184
          makepkg-mingw \
            --noconfirm \
            --noprogressbar \
            --syncdeps \
            --cleanbuild \
            --nobuild
          pacman -Q | LC_ALL=C sort > /tmp/busybox-package-state

          makepkg-mingw --noconfirm --noprogressbar --cleanbuild

          cp "src/busybox-tests-${MSYSTEM}.log" /C/_/artifacts/
          tested="$(printf '%s\n' "${MINGW_PACKAGE_PREFIX}"-busybox-*.pkg.tar.*)"
          reproducible_copy="/tmp/$(basename "${tested}")"
          cp "${tested}" "${reproducible_copy}"
          rm -f "${tested}"

          makepkg-mingw \
            --noconfirm \
            --noprogressbar \
            --cleanbuild \
            --nocheck

          pacman -Q | LC_ALL=C sort > /tmp/busybox-package-state.rebuilt
          cmp /tmp/busybox-package-state /tmp/busybox-package-state.rebuilt

          rebuilt="$(printf '%s\n' "${MINGW_PACKAGE_PREFIX}"-busybox-*.pkg.tar.*)"
          test "$(sha256sum "${rebuilt}" | cut -d' ' -f1)" = \
            "$(sha256sum "${reproducible_copy}" | cut -d' ' -f1)"

          artifact="/C/_/artifacts/$(basename "${rebuilt}")"
          cp "${rebuilt}" "${artifact}"
          pacman --noprogressbar --upgrade --noconfirm "${artifact}"

      - name: Validate native ARM64 package
        if: ${{ matrix.msystem == 'CLANGARM64' }}
        shell: pwsh
        run: |
          $packages = @(
            Get-ChildItem `
              'C:\_\artifacts\mingw-w64-clang-aarch64-busybox-*.pkg.tar.*'
          )
          if ($packages.Count -ne 1) {
            throw "Expected one ARM64 BusyBox package, found $($packages.Count)"
          }
          $package = $packages[0]
          C:\_\mingw-w64-busybox\validate-arm64-package.ps1 `
            -PackageFile $package.FullName `
            -TestLog 'C:\_\artifacts\busybox-tests-CLANGARM64.log' `
            -ArtifactsDirectory 'C:\_\artifacts'

      - name: "Upload binaries"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.msystem }}-packages
          path: |
            C:/_/artifacts/*.pkg.tar.*
            C:/_/artifacts/busybox-arm64-artifact.json
            C:/_/artifacts/SHA256SUMS
            C:/_/artifacts/downstream-install.txt
            C:/_/artifacts/busybox-tests-CLANGARM64.log
          if-no-files-found: ignore

      - name: "Upload dumps"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.msystem }}-dumps
          path: ${{ runner.temp }}/_dumps/*.dmp
          if-no-files-found: ignore

      - name: "Clean up runner"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          If (Test-Path "C:\_") { rm -r -fo "C:\_" }
          msys2 -c 'mv -f /etc/pacman.conf.bak /etc/pacman.conf'
          msys2 -c 'pacman --noconfirm -Suuy'
          msys2 -c 'pacman --noconfirm -Suu'

  check:
    needs: [build]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: UCRT64-packages
          path: C:/_/artifacts
      - name: Check whether to Run
        id: check-run
        run: |
          python .ci/ci-check.py --whether-to-run
      - uses: msys2/setup-msys2@v2
        if: steps.check-run.outputs.run == 'true'
        with:
          msystem: UCRT64
          update: true
          release: ${{ runner.arch != 'ARM64' }}
          install: mingw-w64-ucrt-x86_64-python-pip mingw-w64-ucrt-x86_64-python-pacdb
      - name: Add staging repo
        if: steps.check-run.outputs.run == 'true'
        shell: msys2 {0}
        run: |
          sed -i '1s|^|[staging]\nServer = https://repo.msys2.org/staging/\nSigLevel = Never\n|' /etc/pacman.conf
      - name: Update using staging
        if: steps.check-run.outputs.run == 'true'
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          msys2 -c 'pacman --noconfirm -Suu'
      - name: Run Checks
        if: steps.check-run.outputs.run == 'true'
        shell: msys2 {0}
        run: |
          python .ci/ci-check.py

  package-grokker:
    runs-on: ubuntu-latest
    needs: build
    name: package-grokker-${{ matrix.msystem }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: UCRT64
            repo: ucrt64
          - msystem: CLANG64
            repo: clang64

    steps:
      - uses: actions/download-artifact@v4
        id: artifacts
        continue-on-error: true
        with:
          name: ${{ matrix.msystem }}-packages
          path: artifacts
      - name: Grok packages
        uses: jeremyd2019/package-grokker/grok-artifacts@main
        if: steps.artifacts.outcome == 'success'
        with:
          repo: ${{ matrix.repo }}
          path: artifacts
