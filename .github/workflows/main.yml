{
  "name": "trusted-base-workflow-source-audit",
  "on": {
    "pull_request_target": {
      "branches": [
        "master",
        "crutkas-arm64-ci-action-pins"
      ],
      "types": [
        "opened",
        "synchronize",
        "reopened",
        "ready_for_review"
      ]
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "trusted-base-workflow-source-audit-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "offline-source-audit": {
      "name": "Trusted-base source audit (candidate bytes are never executed)",
      "runs-on": "ubuntu-24.04",
      "permissions": {
        "contents": "read"
      },
      "timeout-minutes": 5,
      "steps": [
        {
          "name": "Checkout trusted base without credentials",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "repository": "${{ github.repository }}",
            "ref": "${{ github.event.pull_request.base.sha }}",
            "path": "trusted-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-nomatrix",
            "persist-credentials": false,
            "fetch-depth": 1,
            "lfs": false,
            "submodules": false,
            "clean": true,
            "set-safe-directory": false,
            "show-progress": false
          }
        },
        {
          "name": "Checkout exact candidate head as inert input",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "repository": "${{ github.event.pull_request.head.repo.full_name }}",
            "ref": "${{ github.event.pull_request.head.sha }}",
            "path": "candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-nomatrix",
            "persist-credentials": false,
            "fetch-depth": 1,
            "lfs": false,
            "submodules": false,
            "clean": true,
            "set-safe-directory": false,
            "show-progress": false
          }
        },
        {
          "name": "Parse candidate source with trusted checker",
          "shell": "bash",
          "env": {
            "TRUSTED_ROOT": "trusted-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-nomatrix",
            "CANDIDATE_ROOT": "candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-nomatrix"
          },
          "run": "python3 -I -B \"$GITHUB_WORKSPACE/$TRUSTED_ROOT/.ci/check-workflow-hardening.py\" --self-test\npython3 -I -B \"$GITHUB_WORKSPACE/$TRUSTED_ROOT/.ci/check-workflow-hardening.py\" --repo \"$GITHUB_WORKSPACE/$CANDIDATE_ROOT\""
        }
      ]
    }
  }
}
