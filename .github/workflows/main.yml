name: main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  build:
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master'}}
    strategy:
      fail-fast: false
      matrix:
        include: [
          { msystem: UCRT64, runner: windows-2025 },
          { msystem: CLANG64, runner: windows-2025 },
          { msystem: MINGW64, runner: windows-2025 },
          { msystem: MINGW32, runner: windows-2025 },
          { msystem: CLANGARM64, runner: windows-11-arm }
        ]
    name: ${{ matrix.msystem }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Get CPU Name
        id: facts
        run : |
          Get-CIMInstance -Class Win32_Processor | Select-Object -Property Name
          $buildDrive = Split-Path $env:GITHUB_WORKSPACE -Qualifier
          "drive=$buildDrive" >> $env:GITHUB_OUTPUT

      - name: Setup JIT minidump
        if: ${{ matrix.msystem != 'CLANGARM64' }}
        run: |
          Set-Location '${{ runner.temp }}'
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Procdump.zip' -OutFile Procdump.zip
          Expand-Archive Procdump.zip -DestinationPath .
          New-Item -Path '_dumps' -ItemType Directory
          .\procdump64.exe -accepteula -ma -i "${{ runner.temp }}/_dumps"
          .\procdump.exe -accepteula -ma -i "${{ runner.temp }}/_dumps"

      - name: Configure Pagefile
        if: ${{ matrix.msystem != 'CLANGARM64' }}
        # https://github.com/al-cheb/configure-pagefile-action/issues/16
        continue-on-error: true
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 4GB
          maximum-size: 16GB
          disk-root: "C:"

      - uses: actions/checkout@v4
        with:
          path: temp
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # to match the autobuild environment
      - uses: actions/setup-python@v5
        if: ${{ matrix.msystem != 'CLANGARM64' }}
        with:
          python-version: '3.12'
          architecture: 'x64'

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            git python base-devel
            ${{ matrix.msystem == 'CLANGARM64' && 'mingw-w64-clang-aarch64-llvm' || '' }}
          update: true
          release: true
          location: '${{ steps.facts.outputs.drive }}\M'

      - name: Add staging repo
        shell: msys2 {0}
        run: |
          cp /etc/pacman.conf /etc/pacman.conf.bak
          grep -qFx '[staging]' /etc/pacman.conf || sed -i '/^# \[staging\]/,/^$/ s|^# ||g' /etc/pacman.conf

      - name: Update using staging
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          msys2 -c 'pacman --noconfirm -Suu'

      - name: Move Checkout
        run: |
          If (Test-Path "C:\_") { rm -r -fo "C:\_" }
          Copy-Item -Path ".\temp" -Destination "C:\_" -Recurse

      - name: CI-Build
        shell: msys2 {0}
        id: build
        run: |
          cd /C/_
          unset VCPKG_ROOT
          MINGW_ARCH=${{ matrix.msystem }} ./.ci/ci-build.sh

      - name: Audit native ARM64 Vim candidate
        if: ${{ matrix.msystem == 'CLANGARM64' && hashFiles('temp/mingw-w64-vim/PKGBUILD') != '' }}
        shell: pwsh
        run: |
          $archives = Get-ChildItem C:\_\artifacts\*vim*.pkg.tar.* | ForEach-Object FullName
          if ($archives.Count -ne 2) {
            throw "Expected two Vim package splits, found $($archives.Count)"
          }
          $msysRoot = '${{ steps.msys2.outputs.msys2-location }}'
          $dependencyArchives = @(
            Get-ChildItem "$msysRoot\var\cache\pacman\pkg\mingw-w64-clang-aarch64-libiconv-*.pkg.tar.*" -ErrorAction SilentlyContinue |
              Where-Object Name -NotLike '*.sig' |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            Get-ChildItem "$msysRoot\var\cache\pacman\pkg\mingw-w64-clang-aarch64-gettext-runtime-*.pkg.tar.*" -ErrorAction SilentlyContinue |
              Where-Object Name -NotLike '*.sig' |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            Get-ChildItem "$msysRoot\var\cache\pacman\pkg\mingw-w64-clang-aarch64-gcc-libs-*.pkg.tar.*" -ErrorAction SilentlyContinue |
              Where-Object Name -NotLike '*.sig' |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          ) | ForEach-Object FullName
          C:\_\mingw-w64-vim\native-arm64-vim-audit.ps1 `
            -Archives $archives `
            -DependencyArchives $dependencyArchives `
            -FallbackDependencyPrefix "$msysRoot\clangarm64" `
            -Root C:\_\native-arm64-vim-root `
            -MsysRoot $msysRoot `
            -ReportDirectory C:\_\native-arm64-vim-evidence

      - name: Smoke native ARM64 Vim candidate
        if: ${{ matrix.msystem == 'CLANGARM64' && hashFiles('temp/mingw-w64-vim/PKGBUILD') != '' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          C:\_\mingw-w64-vim\native-arm64-vim-smoke.ps1 `
            -Root C:\_\native-arm64-vim-root `
            -MsysRoot '${{ steps.msys2.outputs.msys2-location }}' `
            -ReportDirectory C:\_\native-arm64-vim-evidence

      - name: "Upload binaries"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.msystem }}-packages
          path: C:/_/artifacts/*.pkg.tar.*
          if-no-files-found: ignore

      - name: "Upload dumps"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.msystem }}-dumps
          path: ${{ runner.temp }}/_dumps/*.dmp
          if-no-files-found: ignore

      - name: "Upload native ARM64 Vim evidence"
        if: ${{ !cancelled() && matrix.msystem == 'CLANGARM64' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-arm64-vim-evidence
          path: C:/_/native-arm64-vim-evidence
          if-no-files-found: ignore

      - name: "Clean up runner"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          If (Test-Path "C:\_") { rm -r -fo "C:\_" }
          msys2 -c 'mv -f /etc/pacman.conf.bak /etc/pacman.conf'
          msys2 -c 'pacman --noconfirm -Suuy'
          msys2 -c 'pacman --noconfirm -Suu'

  check:
    needs: [build]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: UCRT64-packages
          path: C:/_/artifacts
      - name: Check whether to Run
        id: check-run
        run: |
          python .ci/ci-check.py --whether-to-run
      - uses: msys2/setup-msys2@v2
        if: steps.check-run.outputs.run == 'true'
        with:
          msystem: UCRT64
          update: true
          release: ${{ runner.arch != 'ARM64' }}
          install: mingw-w64-ucrt-x86_64-python-pip mingw-w64-ucrt-x86_64-python-pacdb
      - name: Add staging repo
        if: steps.check-run.outputs.run == 'true'
        shell: msys2 {0}
        run: |
          sed -i '1s|^|[staging]\nServer = https://repo.msys2.org/staging/\nSigLevel = Never\n|' /etc/pacman.conf
      - name: Update using staging
        if: steps.check-run.outputs.run == 'true'
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          msys2 -c 'pacman --noconfirm -Suu'
      - name: Run Checks
        if: steps.check-run.outputs.run == 'true'
        shell: msys2 {0}
        run: |
          python .ci/ci-check.py

  package-grokker:
    runs-on: ubuntu-latest
    needs: build
    name: package-grokker-${{ matrix.msystem }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: UCRT64
            repo: ucrt64
          - msystem: CLANG64
            repo: clang64

    steps:
      - uses: actions/download-artifact@v4
        id: artifacts
        continue-on-error: true
        with:
          name: ${{ matrix.msystem }}-packages
          path: artifacts
      - name: Grok packages
        uses: jeremyd2019/package-grokker/grok-artifacts@main
        if: steps.artifacts.outcome == 'success'
        with:
          repo: ${{ matrix.repo }}
          path: artifacts
